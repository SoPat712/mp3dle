<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>mp3dle</title>
		<meta name="theme-color" content="#1f3561" />
		<link rel="preconnect" href="https://w.soundcloud.com" />
		<link rel="preconnect" href="https://widget.sndcdn.com" />
		<link rel="preconnect" href="https://api-widget.soundcloud.com" />
		<link rel="preconnect" href="https://i1.sndcdn.com" />
		<script>
			// apply the theme before the app paints
			try {
				let saved;
				try {
					saved =
						localStorage.getItem('mp3dle:theme') ??
						localStorage.getItem('soundcloud-heardle:theme');
				} catch {}
				const dark =
					saved === 'dark' ||
					(saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
				const theme = dark ? 'dark' : 'light';
				document.documentElement.dataset.theme = theme;
				document.documentElement.style.colorScheme = theme;
				document
					.querySelector('meta[name="theme-color"]')
					.setAttribute('content', dark ? '#10192e' : '#1f3561');
			} catch {}
		</script>
		<script>
			// start the catalog and player script downloads while the app loads. the url must match src/routes/+page.ts
			try {
				const artist = new URLSearchParams(location.search).get('artist')?.trim() ?? '';
				if (/^[a-z0-9_-]+$/i.test(artist)) {
					const catalog = document.createElement('link');
					catalog.rel = 'preload';
					catalog.as = 'fetch';
					catalog.crossOrigin = 'anonymous';
					catalog.href = `/api/soundcloud/catalog?artist=${encodeURIComponent(artist)}&schema=3`;
					document.head.appendChild(catalog);
					const widget = document.createElement('link');
					widget.rel = 'preload';
					widget.as = 'script';
					widget.href = 'https://w.soundcloud.com/player/api.js';
					document.head.appendChild(widget);
				}
			} catch {}
		</script>
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="mp3dle" />
		<meta property="og:title" content="mp3dle" />
		<meta property="og:url" content="https://mp3dle.joshpatra.me/" />
		<meta property="og:image" content="https://mp3dle.joshpatra.me/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="The mp3dle player on its desktop" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="https://mp3dle.joshpatra.me/og.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="icon" href="/favicon.svg" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
