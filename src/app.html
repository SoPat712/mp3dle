<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>mp3dle</title>
		<meta name="theme-color" content="#1f3561" />
		<script>
			// apply the theme before the app paints
			try {
				let saved;
				try {
					saved =
						localStorage.getItem('mp3dle:theme') ??
						localStorage.getItem('soundcloud-heardle:theme');
				} catch {}
				const dark =
					saved === 'dark' ||
					(saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
				const theme = dark ? 'dark' : 'light';
				document.documentElement.dataset.theme = theme;
				document.documentElement.style.colorScheme = theme;
				document
					.querySelector('meta[name="theme-color"]')
					.setAttribute('content', dark ? '#10192e' : '#1f3561');
			} catch {}
		</script>
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="mp3dle" />
		<meta property="og:title" content="mp3dle" />
		<meta property="og:url" content="https://mp3dle.joshpatra.me/" />
		<meta property="og:image" content="https://mp3dle.joshpatra.me/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="The mp3dle player on its desktop" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="https://mp3dle.joshpatra.me/og.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="icon" href="/favicon.svg" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
